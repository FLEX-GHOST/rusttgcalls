[package]
name = "rusttgcalls"
version = "0.1.0"
edition = "2024"
authors = ["FLEX-GHOST"]
description = "Pure Rust library for Telegram group calls and live streaming."
license = "GPL-3.0"
repository = "https://github.com/FLEX-GHOST/rusttgcalls"

[lib]
name = "rusttgcalls"
path = "rusttgcalls.rs"

[features]
default = []
jemalloc = ["dep:tikv-jemallocator"]

[dependencies]
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"
parking_lot = "0.12.5"
rtc = { version = "0.20.2", features = ["ring"] }
rcgen = "0.14.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
bytes = "1.12.1"
tracing = "0.1.44"
thiserror = "2.0.20"
rand = "0.9"
ring = "0.17.14"
quinn-udp = "0.6.1"
simd-json = "0.17.3"
papaya = "0.2.4"
tikv-jemallocator = { version = "0.7.0", optional = true }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
